<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerpulse Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdfbf7;
      margin: 0;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #ffa533;
      color: white;
    }

    header h1 {
      font-size: 20px;
    }

    header nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .message {
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background: #e6392f;
      color: white;
      align-self: flex-end;
    }

    .bot {
      background: #f1f1f1;
      color: #111;
      align-self: flex-start;
    }

    .button-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .option-btn {
      background: #e6392f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .option-btn:hover {
      background: #d62828;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #ffa533;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>POWERPULSE Chatbot</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="order.html">Bestel</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="chat-container">
  <div class="messages" id="messages">
    <div class="message bot">
      Hallo! 👋<br>
      Ik ben je Powerpulse-assistent. Kies hieronder een onderwerp om meer te weten.
    </div>
  </div>

  <div class="button-options">
    <button class="option-btn" onclick="handleChoice('bestellen')">🛒 Bestellen</button>
    <button class="option-btn" onclick="handleChoice('smaken')">🍓 Smaken</button>
    <button class="option-btn" onclick="handleChoice('prijs')">💰 Prijs</button>
    <button class="option-btn" onclick="handleChoice('contact')">📞 Contact</button>
    <button class="option-btn" onclick="handleChoice('levering')">🚚 Levering</button>
  </div>
</div>

<footer>
  © 2025 Powerpulse. Alle rechten voorbehouden.
</footer>

<script>
  const messagesContainer = document.getElementById("messages");

  function handleChoice(choice) {
    addMessage("user", `👉 ${choice.charAt(0).toUpperCase() + choice.slice(1)}`);
    setTimeout(() => {
      let response = "";

      switch (choice) {
        case "bestellen":
          response = "Je kunt eenvoudig een drankje samenstellen op de Bestel-pagina.";
          break;
        case "smaken":
          response = "We hebben smaken zoals citroen, sinaasappel, mango en aardbei!";
          break;
        case "prijs":
          response = "De prijs hangt af van de ingrediënten, meestal tussen €3 en €6.";
          break;
        case "contact":
          response = "Je kunt ons bereiken via de Contact-pagina — daar staan e-mail en telefoonnummer.";
          break;
        case "levering":
          response = "Levering duurt meestal 1-3 werkdagen, afhankelijk van je locatie.";
          break;
        default:
          response = "Sorry, dat onderwerp ken ik niet.";
      }

      addMessage("bot", response);
    }, 500);
  }

  function addMessage(type, text) {
    const msg = document.createElement("div");
    msg.classList.add("message", type);
    msg.textContent = text;
    messagesContainer.appendChild(msg);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }
</script>

</body>
</html>

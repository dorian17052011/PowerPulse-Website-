<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerpulse Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdfbf7;
      margin: 0;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #ffa533;
      color: white;
    }

    header h1 {
      font-size: 20px;
    }

    header nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .message {
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background: #e6392f;
      color: white;
      align-self: flex-end;
    }

    .bot {
      background: #f1f1f1;
      color: #111;
      align-self: flex-start;
    }

    .button-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .option-btn {
      background: #e6392f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .option-btn:hover {
      background: #d62828;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #ffa533;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>POWERPULSE Chatbot</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="order.html">Bestel</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="chat-container">
  <div class="messages" id="messages">
    <div class="message bot">
      Hallo! 👋<br>
      Ik ben je Powerpulse-assistent. Kies hieronder een onderwerp om te beginnen:
    </div>
  </div>

  <div class="button-options" id="options"></div>
</div>

<footer>
  © 2025 Powerpulse. Alle rechten voorbehouden.
</footer>

<script>
  const messagesContainer = document.getElementById("messages");
  const optionsContainer = document.getElementById("options");

  // Hoofdmenu-opties
  const mainOptions = [
    { text: "🛒 Bestellen", value: "bestellen" },
    { text: "🍓 Smaken", value: "smaken" },
    { text: "💰 Prijs", value: "prijs" },
    { text: "📞 Contact", value: "contact" },
    { text: "🚚 Levering", value: "levering" }
  ];

  const subOptions = {
    bestellen: [
      { text: "Hoe bestel ik een drankje?", value: "hoe_bestellen" },
      { text: "Kan ik mijn eigen mix maken?", value: "eigen_mix" },
      { text: "Terug naar hoofdmenu", value: "back" }
    ],
    smaken: [
      { text: "Welke smaken zijn er?", value: "welke_smaken" },
      { text: "Kan ik smaken combineren?", value: "smaken_combineren" },
      { text: "Terug naar hoofdmenu", value: "back" }
    ],
    prijs: [
      { text: "Wat kost een drankje?", value: "prijs_info" },
      { text: "Zijn er kortingen?", value: "kortingen" },
      { text: "Terug naar hoofdmenu", value: "back" }
    ],
    contact: [
      { text: "Hoe neem ik contact op?", value: "contact_opnemen" },
      { text: "Wat is jullie e-mail?", value: "email_info" },
      { text: "Terug naar hoofdmenu", value: "back" }
    ],
    levering: [
      { text: "Hoe lang duurt levering?", value: "levering_tijd" },
      { text: "Kan ik mijn bestelling volgen?", value: "volgen" },
      { text: "Terug naar hoofdmenu", value: "back" }
    ]
  };

  // Reacties van de chatbot
  const responses = {
    hoe_bestellen: "Je kunt bestellen via de bestelpagina, daar stel je jouw drankje samen en vul je je gegevens in.",
    eigen_mix: "Ja! Je kunt zelf kiezen welke smaken, energieboosters en extra’s je toevoegt.",
    welke_smaken: "We hebben smaken zoals citroen, aardbei, mango, perzik en bosbes!",
    smaken_combineren: "Ja, je kunt maximaal twee smaken combineren om je perfecte mix te maken.",
    prijs_info: "De meeste drankjes kosten tussen de €3 en €6, afhankelijk van je samenstelling.",
    kortingen: "Soms zijn er acties, volg ons op Instagram voor kortingen!",
    contact_opnemen: "Je kunt ons bereiken via de contactpagina — daar vind je het formulier en telefoonnummer.",
    email_info: "Ons e-mailadres is info@powerpulse.nl.",
    levering_tijd: "Levering duurt meestal 1 tot 3 werkdagen, afhankelijk van je locatie.",
    volgen: "Na je bestelling ontvang je een e-mail met een volgcode.",
  };

  // Start met hoofdmenu
  showOptions(mainOptions);

  function showOptions(options) {
    optionsContainer.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt.text;
      btn.onclick = () => handleChoice(opt.value);
      optionsContainer.appendChild(btn);
    });
  }

  function handleChoice(choice) {
    if (choice === "back") {
      addMessage("user", "🔙 Terug naar hoofdmenu");
      showOptions(mainOptions);
      return;
    }

    addMessage("user", `👉 ${choice.replaceAll("_", " ")}`);

    if (subOptions[choice]) {
      // Gebruiker heeft een categorie gekozen
      setTimeout(() => {
        addMessage("bot", "Kies een van de onderstaande opties:");
        showOptions(subOptions[choice]);
      }, 500);
    } else {
      // Gebruiker heeft een specifieke vraag gekozen
      setTimeout(() => {
        addMessage("bot", responses[choice] || "Daar weet ik helaas niks over 😅");
        showOptions(mainOptions);
      }, 600);
    }
  }

  function addMessage(type, text) {
    const msg = document.createElement("div");
    msg.classList.add("message", type);
    msg.textContent = text;
    messagesContainer.appendChild(msg);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }
</script>

</body>
</html>

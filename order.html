<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerpulse - Bestel Je Drink</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fdfbf7;
      color: #111;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #ffa533;
      color: white;
    }

    header h1 {
      font-size: 18px;
      font-weight: bold;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .checkbox-group {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkbox-group label {
      font-weight: normal;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 30px;
      background: #e6392f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background: #d62828;
    }
  </style>
</head>
<body>

  <header>
    <h1>POWERPULSE</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h2>Bestel Je Drink</h2>
    <form>
      <!-- Basis -->
      <label for="base">Kies een basis</label>
      <select id="base" name="base">
        <option value="water">Wit / Water</option>
        <option value="sap">Geel / Sap</option>
        <option value="thee">Bruin / Thee</option>
      </select>

      <!-- Smaakstoffen (1 of 2) -->
      <label>Smaakstoffen (kies 1 of 2)</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="flavors" value="Aardbei"> Aardbei</label>
        <label><input type="checkbox" name="flavors" value="Mango"> Mango</label>
        <label><input type="checkbox" name="flavors" value="Citroen-limoen"> Citroen-limoen</label>
        <label><input type="checkbox" name="flavors" value="Watermeloen"> Watermeloen</label>
        <label><input type="checkbox" name="flavors" value="Blauwe bes"> Blauwe bes</label>
        <label><input type="checkbox" name="flavors" value="Perzik"> Perzik</label>
      </div>

      <!-- Energieboosters (0 of 1) -->
      <label>Energieboosters (kies 0 of 1)</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="boosters" value="Cafeïne"> Cafeïne</label>
        <label><input type="checkbox" name="boosters" value="Guarana"> Guarana</label>
      </div>

      <!-- Elektrolyten -->
      <label>Elektrolyten (voor hydratatie)</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="electrolytes" value="Natrium"> Natrium</label>
        <label><input type="checkbox" name="electrolytes" value="Kalium"> Kalium</label>
        <label><input type="checkbox" name="electrolytes" value="Magnesium"> Magnesium</label>
      </div>

      <!-- Suikers / zoetstoffen -->
      <label>Suikers / zoetstoffen</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="sweeteners" value="Dextrose"> Dextrose</label>
        <label><input type="checkbox" name="sweeteners" value="Honingextract"> Honingextract</label>
        <label><input type="checkbox" name="sweeteners" value="Stevia"> Stevia</label>
      </div>

      <!-- Extra’s -->
      <label>Extra’s (optioneel)</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="extras" value="BCAAs"> BCAA’s</label>
        <label><input type="checkbox" name="extras" value="Vitamine C"> Vitamine C</label>
        <label><input type="checkbox" name="extras" value="Spirulina"> Spirulina</label>
        <label><input type="checkbox" name="extras" value="Gemberextract"> Gemberextract</label>
      </div>

      <!-- Naam en aantal -->
      <label for="name">Naam</label>
      <input type="text" id="name" name="name" placeholder="Je naam" required>

      <label for="quantity">Aantal</label>
      <input type="number" id="quantity" name="quantity" min="1" value="1" required>

      <button type="submit" class="btn">Bestel</button>
    </form>
  </div>

  <footer>
    © 2025 Powerpulse. Alle rechten voorbehouden.
  </footer>

</body>
</html>
